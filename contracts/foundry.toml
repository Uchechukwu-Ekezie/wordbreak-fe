[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

# Scoped read-only access for one-off ops scripts (e.g. LoadWords.s.sol) that need to read a
# data file at script time. Deliberately narrow -- just this directory, read-only.
fs_permissions = [{ access = "read", path = "script/data" }]

[fmt]
line_length = 100
tab_width = 4

# Celo networks — RPC endpoints read from env at deploy time.
[rpc_endpoints]
celo = "https://forno.celo.org"
celo_sepolia = "https://forno.celo-sepolia.celo-testnet.org"

[etherscan]
celo = { key = "${CELOSCAN_API_KEY}", url = "https://api.celoscan.io/api", chain = 42220 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
